appId: com.anonymous.factor
---
# Creating an Observation and defining a Metric for it, then confirming both were
# persisted. Creation has no screen of its own to confirm on, so the Observation
# List is where the result is read.

# Empty to start, so a re-run doesn't stack a second "Sleep" beside the first.
- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: reset
      READY_TEXT: "No observations created yet."

- tapOn: "Create observation"
- assertVisible: "New Observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "Sleep"
- tapOn: "e.g., Duration"
- inputText: "Hours"
- hideKeyboard
- tapOn: "Create Observation"

- assertVisible: "Sleep"
- assertNotVisible: "No observations created yet."

# The Metric renders only on the details screen, so the Observation appearing in
# the list would not by itself prove the Metric was saved alongside it.
- tapOn: "Sleep"
- assertVisible: "Hours"
