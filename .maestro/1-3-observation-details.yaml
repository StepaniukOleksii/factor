appId: com.anonymous.factor
---
# Opening an Observation from the list and reading its Records: a tile collapsed,
# the same tile expanded, the route on to a new Record, and the empty state.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

# `no numeric` charts only its Enum `mood`, so a single trend card sits above its
# Records rather than the five `mixed metrics` would put there.
- tapOn: "no numeric"
- assertVisible: "RECENT RECORDS"
- assertVisible: "Add Record"

- assertNotVisible: "MOOD"
- assertNotVisible: "DONE"

- tapOn: "Today.*"
- assertVisible: "MOOD"
- assertVisible: "DONE"

- tapOn: "Today.*"
- assertNotVisible: "MOOD"

- tapOn: "Add Record"
- assertVisible: "mood: None.*"
- back

# The header arrow rather than a back press: this screen swallows one while its
# Records are still loading, and the re-focus above started exactly that load.
- tapOn: "Back"

- tapOn: "no records"
- assertVisible: "No records yet."
