appId: com.anonymous.factor
---
# Opening an Observation from the list and reading its Records: a tile collapsed,
# the same tile expanded, the route on to a new Record, and the empty state.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

# `no numeric` charts its Enum `mood` and its Boolean `done`, so two trend cards
# sit above its Records rather than the five `mixed metrics` would put there.
- tapOn: "no numeric"
- assertVisible: "RECENT RECORDS"
- assertVisible: "Add Record"

# Maestro matches text case-insensitively, so the `MOOD` and `DONE` chips an
# expanded tile shows cannot be told from the `mood` and `done` cards above them.
# `done`'s value can, and the fixture tosses a coin for which word it reads.
- assertNotVisible: "Yes|No"

- tapOn: "Today.*"
- assertVisible: "Yes|No"

- tapOn: "Today.*"
- assertNotVisible: "Yes|No"

- tapOn: "Add Record"
- assertVisible: "mood: None.*"
- back

# The header arrow rather than a back press: this screen swallows one while its
# Records are still loading, and the re-focus above started exactly that load.
- tapOn: "Back"

- tapOn: "no records"
- assertVisible: "No records yet."
