appId: com.anonymous.factor
---
# Editing a Record: the form opens on the stored values, a saved change reaches
# the Observation Details screen, and an abandoned one leaves the Record alone.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

# `no numeric` charts only its Enum `mood`, so a single trend card sits above its
# Records rather than the five `mixed metrics` would put there.
- tapOn: "no numeric"

# The fixture picks `mood` from three values at random, so the first edit is what
# makes the Record's value known - it reads `low` from here on.
- longPressOn: "Today.*"
- tapOn: "Edit Record"
- assertVisible: "Save Record"
- tapOn: "mood: .*"
- tapOn: "low"
- tapOn: "Save Record"

- tapOn: "Today.*"
- assertVisible: "low"

- longPressOn: "Today.*"
- tapOn: "Edit Record"
- assertVisible: "low"
- tapOn: "mood: low.*"
- tapOn: "high"
- tapOn: "Save Record"

- assertVisible: "high"
- assertNotVisible: "low"

# Abandoned
- longPressOn: "Today.*"
- tapOn: "Edit Record"
- tapOn: "mood: high.*"
- tapOn: "ok"
- tapOn: "Cancel editing"
- tapOn: "Discard unsaved changes"

- assertVisible: "high"
- assertNotVisible: "ok"
