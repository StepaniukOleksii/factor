appId: com.anonymous.factor
---
# Editing a Record's Date and Time through the native pickers, and what becomes
# of the change on save and on leaving.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no records"

# The Record is made here rather than seeded because it has to be timestamped
# today: that is what opens the date picker on the current month, the only month
# where the cap on later days is visible. Being the Observation's only Record, it
# also cannot fall out of the three on show once it is backdated below.
- tapOn: "no records"
- tapOn: "Add Record"
- assertNotVisible:
    id: "record-date-field"
- assertNotVisible:
    id: "record-time-field"
- tapOn: "value value"
- inputText: "10"
- hideKeyboard
- tapOn: "Add Record"

- longPressOn: "Today.*"
- tapOn: "Edit Record"
- assertVisible: "Date"
- assertVisible: "Time"

# The date picker
- tapOn:
    id: "record-date-field"
# No way forward out of the current month is how the cap at today shows.
- assertNotVisible: "Next month"
- tapOn: "Previous month"
# The button the month just left behind, so the day tapped next is that month's.
- assertVisible: "Next month"
- tapOn: "15"
- tapOn: "OK"
- assertVisible: "[A-Za-z]{3} 15"

# The time picker, typed rather than dialled. Which side of noon it opens on is
# the run's own clock, so the meridiem stays whatever it was.
- tapOn:
    id: "record-time-field"
- tapOn:
    id: "android:id/toggle_mode"
- tapOn:
    id: "android:id/input_hour"
- eraseText
- inputText: "8"
- tapOn:
    id: "android:id/input_minute"
- eraseText
- inputText: "05"
- tapOn: "OK"
- assertVisible: "8:05 [AP]M"
- assertVisible: "[A-Za-z]{3} 15"

# A second date, to show the time just set survives one
- tapOn:
    id: "record-date-field"
- tapOn: "20"
- tapOn: "OK"
- assertVisible: "[A-Za-z]{3} 20"
- assertVisible: "8:05 [AP]M"

- tapOn: "value value"
- eraseText
- inputText: "55"
- hideKeyboard
- tapOn: "Save Record"

- assertVisible: "[A-Za-z]{3} 20, 8:05 [AP]M"
- tapOn: "[A-Za-z]{3} 20, 8:05 [AP]M"
- assertVisible: "55"

# Re-opened on what was saved
- longPressOn: "[A-Za-z]{3} 20, 8:05 [AP]M"
- tapOn: "Edit Record"
- assertVisible: "[A-Za-z]{3} 20"
- assertVisible: "8:05 [AP]M"

# Left without saving
- tapOn:
    id: "record-date-field"
- tapOn: "10"
- tapOn: "OK"
- assertVisible: "[A-Za-z]{3} 10"
- tapOn: "Cancel editing"
- tapOn: "Discard unsaved changes"
- assertVisible: "[A-Za-z]{3} 20, 8:05 [AP]M"
