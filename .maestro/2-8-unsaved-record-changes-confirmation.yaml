appId: com.anonymous.factor
---
# Leaving a Record form that holds an unsaved change asks first. Of the form's
# four exits, the cross button is the one taken here.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

# `no numeric` charts only its Enum `mood`, so a single trend card sits above its
# Records rather than the five `mixed metrics` would put there.
- tapOn: "no numeric"

- longPressOn: "Today.*"
- tapOn: "Edit Record"
- assertVisible: "Save Record"

# The fixture picks `mood` at random, so the change is to the one state it cannot
# already be in - nothing else guarantees the form comes out dirty.
- tapOn: "mood: .*"
- tapOn: "None"
- tapOn: "Cancel editing"
- assertVisible: "Discard changes?"

# Kept
- tapOn: "Keep editing this record"
- assertNotVisible: "Discard changes?"
- assertVisible: "mood: None.*"

# Discarded
- tapOn: "Cancel editing"
- tapOn: "Discard unsaved changes"
- assertVisible: "RECENT RECORDS"
