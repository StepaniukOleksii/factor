appId: com.anonymous.factor
---
# The Trends section on an Observation with no Numeric Metric: that it appears
# at all, carries its selector, and gives the Enum Metric a card. What the
# swimlane draws is inside the canvas and out of reach - Skia puts nothing into
# the view hierarchy.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

- tapOn: "no numeric"
- assertVisible: "TRENDS"
- assertVisible:
    id: "time-range-preset-1M"
    selected: true
- assertVisible: "mood"
- assertVisible:
    id: "trend-chart"

- assertVisible: "RECENT RECORDS"
- assertVisible: "Today.*"
