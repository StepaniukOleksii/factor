appId: com.anonymous.factor
---
# A submission that breaks the form's rules is refused in place: each rule marked
# on the field it belongs to, and nothing written.

- runFlow:
    file: subflows/launch.yaml
    env:
      DEV_COMMAND: reset
      READY_TEXT: "No observations created yet."

- tapOn: "Create observation"
- assertVisible: "New Observation"
- tapOn: "Create Observation"

- assertVisible: "Observation name cannot be empty"
- assertVisible: "Metric name cannot be empty"
# The title of the Alert these inline marks replaced.
- assertNotVisible: "Error"

- back
- assertVisible: "No observations created yet."
