appId: io.github.stepaniukoleksii.factor.dev
---
# Creating an Observation: what the form refuses, what it accepts, and that a
# name already taken is among the refusals.

# Empty to start, so a re-run doesn't stack a second "Sleep" beside the first.
- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: reset
      READY_TEXT: "No observations created yet."

- tapOn: "Create observation"
- assertVisible: "New Observation"

# Nothing filled in: each rule marked on the field it belongs to.
- tapOn: "Create Observation"
- assertVisible: "Observation name cannot be empty"
- assertVisible: "Metric name cannot be empty"
# The title of the Alert these inline marks replaced.
- assertNotVisible: "Error"

# Nothing was written by the refused submission.
- back
- assertVisible: "No observations created yet."

- tapOn: "Create observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "Sleep"
- tapOn: "e.g., Duration"
- inputText: "Hours"
- hideKeyboard
- tapOn: "Create Observation"

- assertVisible: "Sleep"
- assertNotVisible: "No observations created yet."

# The Metric renders only on the details screen, so the Observation appearing in
# the list would not by itself prove the Metric was saved alongside it.
- tapOn: "Sleep"
- assertVisible: "Hours"
- tapOn: "Back"

# The name just taken, cased differently: names are compared ignoring case.
- tapOn: "Create observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "sleep"
- tapOn: "e.g., Duration"
- inputText: "Hours"
- hideKeyboard
- tapOn: "Create Observation"

- assertVisible: "An observation with this name already exists"

- tapOn: "sleep"
- eraseText
- inputText: "Sleep 2"
- hideKeyboard
- tapOn: "Create Observation"

# The name field would still hold this text had the save been refused, so the
# list's own header is what tells the two apart.
- assertVisible: "Observations"
- assertVisible: "Sleep 2"

# --- A second Metric, given a type of its own --------------------------------
- tapOn: "Create observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "Energy"
- tapOn: "e.g., Duration"
- inputText: "Level"
- hideKeyboard

# Every scroll below centres what it is after: an element merely scrolled into
# view can still sit under the keyboard, where the tap reaches the keyboard and
# the text lands in whichever field had focus before.
- scrollUntilVisible:
    element: "Add Metric"
    direction: DOWN
    centerElement: true
- tapOn: "Add Metric"

# Two cards from here on, and their name fields differ in nothing a flow can
# read: same label, and Android keeps the placeholder on the filled one too.
- scrollUntilVisible:
    element:
      id: "metric-name-1"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "metric-name-1"
- inputText: "Weather"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "metric-type-1"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "metric-type-1"
- tapOn: "Choice"

- scrollUntilVisible:
    element:
      id: "metric-value-1-0"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "metric-value-1-0"
- inputText: "sunny"
- hideKeyboard

- scrollUntilVisible:
    element:
      id: "metric-value-1-1"
    direction: DOWN
    centerElement: true
- tapOn:
    id: "metric-value-1-1"
- inputText: "rainy"
- hideKeyboard
- tapOn: "Create Observation"

- assertVisible: "Observations"
- tapOn: "Energy"

# Trend cards come in the Observation's own Metric order, so their order on
# screen is the order the two were declared in.
- assertVisible: "Level"
- assertVisible:
    text: "Weather"
    below: "Level"

# --- The picked type reaches the Record form ---------------------------------
- tapOn: "Add Record"
- tapOn: "Weather: None.*"
- assertVisible: "sunny"
- assertVisible: "rainy"
