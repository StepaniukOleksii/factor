appId: com.anonymous.factor
---
# Deleting an Observation, cancelling once first to show that Cancel is safe.
# Covers the header kebab menu, the confirmation modal, and the pop-to-list
# navigation reset that follows a confirmed delete.

# Start with a list of Observations and make sure target Observation is displayed
- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "stale records"

# `stale records` carries three Records, so the delete has to take them with it
# rather than only the row the list shows.
- tapOn: "stale records"

# Cancel path
- tapOn: "More options"
- tapOn: "Delete observation"
- assertVisible: "Delete Observation?"
- tapOn: "Cancel deletion"
- assertNotVisible: "Delete Observation?"
- assertVisible: "stale records"

# Confirm path
- tapOn: "More options"
- tapOn: "Delete observation"
- assertVisible: "Delete Observation?"
- tapOn: "Confirm deletion"

- assertNotVisible: "stale records"
# An Observation this flow never touched, asserted to show the delete took one row
# rather than clearing the list.
- assertVisible: "mixed metrics"

# --- The name is free again --------------------------------------------------
- tapOn: "Create observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "stale records"
- tapOn: "e.g., Duration"
- inputText: "value"
- hideKeyboard
- tapOn: "Create Observation"

- assertVisible: "Observations"
- assertVisible: "stale records"
