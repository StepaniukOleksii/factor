appId: io.github.stepaniukoleksii.factor.dev
---
# What the app writes is still there after its process ends and starts again.

- runFlow:
    file: ../subflows/launch.yaml
    env:
      DEV_COMMAND: reset
      READY_TEXT: "No observations created yet."

# Entered by hand rather than seeded: what is being checked is the write path a
# user's data actually takes.
- tapOn: "Create observation"
- tapOn: "e.g., Sleep Quality, Mood"
- inputText: "Sleep"
- tapOn: "e.g., Duration"
- inputText: "Hours"
- hideKeyboard
- tapOn: "Create Observation"

- tapOn: "Sleep"
- tapOn: "Add Record"
- tapOn: "Hours value"
# Two digits no clock reading can contain, so the assertion after the restart
# cannot be satisfied by the Record's own timestamp.
- inputText: "88"
- hideKeyboard
- tapOn: "Add Record"
- assertVisible: "Today.*"

# Not `../subflows/launch.yaml`: it empties the database first, which is the one
# thing this flow needs left alone.
- stopApp
- openLink: exp+factor://expo-development-client/?url=http://10.0.2.2:8081
# A restart opens on Home, so what survived is a screen further in than the
# launch lands.
- extendedWaitUntil:
    visible: "Factor"
    timeout: 90000
- tapOn: "Observations"
- extendedWaitUntil:
    visible: "Sleep"
    timeout: 30000

- tapOn: "Sleep"
- assertVisible: "Hours"
- tapOn: "Today.*"
- assertVisible: "88"
