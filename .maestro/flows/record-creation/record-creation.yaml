appId: com.anonymous.factor
---
# Adding a Record by both routes in. They open the same form and differ in where
# saving leaves you: the Observation you came from, or its screen put in the
# form's place.
#
# `no records` is the fixture: its empty state gives an unambiguous before and after.

- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no records"

# --- From the Observation's own screen ---------------------------------------
- tapOn: "no records"
- assertVisible: "No records yet."

- tapOn: "Add Record"
# The form labels each input "<metric name> value", and this Observation's single
# Metric is itself named `value` - hence the doubled selector. It still matches
# only the input; nothing else on the screen carries that label.
- tapOn: "value value"
- inputText: "7"
- hideKeyboard
- tapOn: "Add Record"

# Submitting returns to the Details screen, not the List.
- assertVisible: "Today.*"
- assertNotVisible: "No records yet."
- tapOn: "Back"

# --- From the list, where no Details screen sits beneath the form -------------
- tapOn: "Add record to no records"

# `stale records` carries a Metric named `value` too, so the Observation name in
# the header is what shows the card's own button opened that card's form.
- assertVisible: "no records"
- tapOn: "value value"
- inputText: "9"
- hideKeyboard
- tapOn: "Add Record"

- assertVisible: "RECENT RECORDS"
- assertVisible: "Today.*"

# Saving put this screen in the form's place, so the press that follows reaches
# the list rather than re-entering the form.
- back
- assertVisible: "Observations"
