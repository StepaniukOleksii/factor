appId: io.github.stepaniukoleksii.factor.dev
---
# Deleting a Record from the Observation Details screen: the list refills from
# the Records behind the three on show, and empties once none are left.

- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

# `no numeric` holds five Records and charts both its Metrics: enough to leave a
# fourth waiting behind the three on show, and enough card above RECENT RECORDS
# that all three start off screen.
- tapOn: "no numeric"

# Every seeded Record is timestamped 9:00, so a third match is a third tile.
- scrollUntilVisible:
    element:
      text: ".*, 9:00 AM"
      index: 2
    direction: DOWN

- longPressOn: "Today.*"
- tapOn: "Delete Record"
- tapOn: "Confirm record deletion"

- assertNotVisible: "Delete this record?"
- assertVisible: "RECENT RECORDS"
- assertNotVisible: "Today.*"
# Three again rather than two: the fourth Record took the deleted one's place.
- scrollUntilVisible:
    element:
      text: ".*, 9:00 AM"
      index: 2
    direction: DOWN

- repeat:
    times: 4
    commands:
      - longPressOn: ".*, 9:00 AM"
      - tapOn: "Delete Record"
      - tapOn: "Confirm record deletion"

- assertVisible: "No records yet."
