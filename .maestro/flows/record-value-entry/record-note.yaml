appId: com.anonymous.factor
---
# A Record's note: written at the foot of the Record form, read back on that
# Record's expanded row.

- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "mixed metrics"

# `mixed metrics` is the fixture because it also defines a Metric named `note`,
# so the two are on screen together throughout.
- tapOn: "mixed metrics"
- tapOn: "Add Record"

- scrollUntilVisible:
    element: "Note"
    direction: DOWN
- tapOn: "Note"
- inputText: "typed here, not on any metric"
- hideKeyboard
# Every Metric left empty, which ADR-3 permits.
- tapOn: "Add Record"

- scrollUntilVisible:
    element: "RECENT RECORDS"
    direction: DOWN
# That stops as soon as the header shows, which leaves the rows beneath it under
# the footer button; this is the last section, so one more scroll reaches their
# end.
- scroll
- assertNotVisible: "typed here, not on any metric"

# Several rows can read "Today, <time>" at once; the list is newest first, so the
# Record just added is the first of them.
- tapOn:
    text: "Today.*"
    index: 0
- assertVisible: "typed here, not on any metric"
