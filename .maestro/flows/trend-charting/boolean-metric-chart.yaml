appId: com.anonymous.factor
---
# A Boolean Metric getting a swimlane card of its own, beside the Enum one. What
# either swimlane draws is inside the canvas and out of reach - Skia puts nothing
# into the view hierarchy.

- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "no numeric"

- tapOn: "no numeric"
- assertVisible: "TRENDS"
- assertVisible: "mood"
- assertVisible: "done"
# Cards come in the Observation's own Metric order, so the second canvas is the
# Boolean's.
- assertVisible:
    id: "trend-chart"
    index: 1

- assertVisible: "RECENT RECORDS"
- assertVisible: "Today.*"
