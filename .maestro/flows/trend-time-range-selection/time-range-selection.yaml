appId: io.github.stepaniukoleksii.factor.dev
---
# The window every chart in the Trends section shares: the one it opens on, the
# range modal behind the Custom segment, the switch to a preset, and how long a
# choice lasts.

- runFlow:
    file: ../../subflows/launch.yaml
    env:
      DEV_COMMAND: seed
      READY_TEXT: "mixed metrics"

# `mixed metrics`' five Numeric Metrics are recorded at different resolutions, so
# any window leaves some of them charting and some not.
- tapOn: "mixed metrics"

# --- What it opens on --------------------------------------------------------
- assertVisible:
    id: "time-range-preset-1M"
    selected: true
- assertVisible:
    id: "time-range-preset-1D"
    selected: false
- assertVisible: "Custom"
- assertVisible:
    id: "time-range-custom"
    selected: false

# --- The range modal, dismissed ----------------------------------------------
- runFlow: ../../subflows/wait-for-trends.yaml
- tapOn:
    id: "time-range-custom"
- assertVisible: "Custom time range"
- assertVisible: "Start"
- assertVisible: "End"
- tapOn: "Cancel custom time range"
- assertNotVisible: "Custom time range"
- assertVisible:
    id: "time-range-preset-1M"
    selected: true
- assertVisible:
    id: "time-range-custom"
    selected: false

# --- Applied. Start opens on the day 30 days back, whose month always has a 15th
# that falls on or before today - so the applied range reads the same whenever
# the flow runs. This is why the modal is worked while the default window is
# still showing: a narrower one would open the picker on a month whose 15th may
# be in the future, where the cap at today puts it out of reach.
- tapOn:
    id: "time-range-custom"
- tapOn:
    id: "custom-range-start-date"
- tapOn: "15"
- tapOn: "OK"
- tapOn: "Apply custom time range"
- runFlow: ../../subflows/wait-for-trends.yaml
- assertNotVisible: "Custom time range"
- assertVisible:
    id: "time-range-custom"
    selected: true
- assertVisible: "[A-Za-z]{3} 15 .*"
- assertVisible:
    id: "time-range-preset-1M"
    selected: false

# --- A preset takes the selection back, and the segment stops showing the range
- tapOn:
    id: "time-range-preset-1D"
- runFlow: ../../subflows/wait-for-trends.yaml
- assertVisible:
    id: "time-range-preset-1D"
    selected: true
- assertVisible: "Custom"
- assertNotVisible: "[A-Za-z]{3} 15 .*"
- assertVisible:
    id: "trend-chart"

# --- The window outlives a trip to a Record screen and back ------------------
- tapOn: "Add Record"
- back
- runFlow: ../../subflows/wait-for-trends.yaml
- assertVisible:
    id: "time-range-preset-1D"
    selected: true

# `insufficient`'s one Record is five days old, so a day-wide window leaves it
# with nothing to draw while the Metrics above it still chart.
- scrollUntilVisible:
    element: "Not enough data yet"
    direction: DOWN

# --- Reopening the Observation is a new visit, back at the default -----------
- tapOn: "Back"
- tapOn: "mixed metrics"
- assertVisible:
    id: "time-range-preset-1M"
    selected: true
