<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Factor - Aggregated Point Record Count</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        // Color values copied verbatim from src/presentation/theme/colors.ts, so this
        // mockup matches the running app exactly rather than a generic MD3 token set.
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "background": "#131313",
                        "surface": "#131313",
                        "on-surface": "#e5e2e1",
                        "on-surface-variant": "#c2c9b9",
                        "surface-container-low": "#1c1b1b",
                        "outline-variant": "#42493d",
                        "primary-container": "#b6f09c",
                        "primary": "#f9fff0"
                    },
                    fontFamily: {
                        sans: ["Hanken Grotesk"]
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Hanken Grotesk', sans-serif; }
    </style>
</head>
<body class="bg-background text-on-surface antialiased min-h-screen">

<main class="max-w-2xl mx-auto px-6 py-10 flex flex-col gap-4">

    <div>
        <h1 class="text-xl font-semibold text-primary">Aggregated Point Record Count</h1>
        <p class="text-on-surface-variant text-sm mt-1">A small, muted number above a point whenever
            <code class="text-on-surface">recordCount</code> is greater than one. The dot itself never
            changes.</p>
    </div>

    <div class="bg-surface-container-low border border-outline-variant rounded-xl p-4">
        <h3 class="text-primary text-sm font-semibold mb-3">dense</h3>
        <svg id="chart" viewBox="0 0 300 108" class="w-full h-[108px]" preserveAspectRatio="none"></svg>
    </div>

</main>

<script>
    const PLOT = {x0: 24, x1: 296, y0: 6, y1: 94};
    const DOT_R = 2.5, DOT_HALO_R = 4;
    const LABEL_OFFSET_Y = 9;
    const LABEL_COLOR = '#c2c9b9'; // onSurfaceVariant
    const LABEL_OPACITY = 0.65;

    // A realistic mix: mostly single-Record points, a couple of light
    // aggregations, and one past the 99 cap to show "99+".
    const COUNTS = [1, 1, 3, 1, 1, 12, 1, 1, 45, 1, 1, 150, 1, 7, 1];
    const YS = [42, 46, 50, 47, 55, 52, 58, 54, 60, 57, 62, 59, 64, 61, 66];
    const N = YS.length;

    function scaled() {
        const minY = Math.min(...YS), maxY = Math.max(...YS);
        return YS.map((y, i) => ({
            x: PLOT.x0 + (i / (N - 1)) * (PLOT.x1 - PLOT.x0),
            y: PLOT.y1 - ((y - minY) / (maxY - minY)) * (PLOT.y1 - PLOT.y0),
        }));
    }

    function smoothPath(pts) {
        let d = `M ${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
        for (let i = 0; i < pts.length - 1; i++) {
            const p0 = pts[i - 1] || pts[i], p1 = pts[i], p2 = pts[i + 1], p3 = pts[i + 2] || p2;
            const cp1x = p1.x + (p2.x - p0.x) / 6, cp1y = p1.y + (p2.y - p0.y) / 6;
            const cp2x = p2.x - (p3.x - p1.x) / 6, cp2y = p2.y - (p3.y - p1.y) / 6;
            d += ` C ${cp1x.toFixed(1)} ${cp1y.toFixed(1)}, ${cp2x.toFixed(1)} ${cp2y.toFixed(1)}, ${p2.x.toFixed(1)} ${p2.y.toFixed(1)}`;
        }
        return d;
    }

    function formatPointCount(count) {
        return count > 99 ? '99+' : String(count);
    }

    const pts = scaled();
    const linePath = smoothPath(pts);
    const last = pts[pts.length - 1], first = pts[0];
    const areaPath = `${linePath} L ${last.x.toFixed(1)} ${PLOT.y1} L ${first.x.toFixed(1)} ${PLOT.y1} Z`;

    let svg = `<defs><linearGradient id="grad" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#b6f09c" stop-opacity="0.22"/>
        <stop offset="100%" stop-color="#b6f09c" stop-opacity="0"/>
    </linearGradient></defs>`;
    svg += `<path d="${areaPath}" fill="url(#grad)" />`;
    svg += `<path d="${linePath}" fill="none" stroke="#b6f09c" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" />`;

    pts.forEach((p, i) => {
        svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${DOT_HALO_R}" fill="#1c1b1b" />`;
        svg += `<circle cx="${p.x.toFixed(1)}" cy="${p.y.toFixed(1)}" r="${DOT_R}" fill="#b6f09c" />`;
        if (COUNTS[i] > 1) {
            svg += `<text x="${p.x.toFixed(1)}" y="${(p.y - LABEL_OFFSET_Y).toFixed(1)}" text-anchor="middle" `
                + `font-size="8" font-weight="600" fill="${LABEL_COLOR}" fill-opacity="${LABEL_OPACITY}">${formatPointCount(COUNTS[i])}</text>`;
        }
    });

    document.getElementById('chart').innerHTML = svg;
</script>

</body>
</html>
