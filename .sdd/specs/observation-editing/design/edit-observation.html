<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Edit Observation</title>
    <!--
      Mockup: the Edit Observation screen, opened on the seeded `stale records`
      Observation. Colors, type, radii and elevation are the tokens in
      src/presentation/theme/. 393px wide - the Pixel 7 the E2E suite runs on.
    -->
    <style>
        :root {
            --background: #131313;
            --surface: #131313;
            --on-surface: #e5e2e1;
            --on-surface-variant: #c2c9b9;
            --surface-container-lowest: #0e0e0e;
            --surface-container-low: #1c1b1b;
            --outline-variant: #42493d;
            --outline: #8c9385;
            --primary: #f9fff0;
            --on-primary: #0b3900;
            --primary-container: #b6f09c;
            --on-primary-fixed-variant: #205110;

            --radius-md: 8px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            font-family: Roboto, "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }

        .phone {
            position: relative;
            width: 393px;
            height: 760px;
            background: var(--background);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ScreenContainer's status-bar padding. */
        .status-bar {
            height: 28px;
            flex: none;
        }

        /* ScreenHeader */
        .header {
            flex: none;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-bottom: 1px solid var(--outline-variant);
            background: var(--surface);
        }

        .header-action {
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-action.right {
            justify-content: flex-end;
            padding-right: 8px;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            color: var(--primary);
        }

        .content {
            flex: 1;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        /* LabeledTextField */
        .field-label {
            font-size: 14px;
            font-weight: 600;
            color: var(--on-surface-variant);
            margin-bottom: 8px;
        }

        .input {
            background: var(--surface-container-lowest);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-md);
            padding: 12px 16px;
            color: var(--on-surface);
            font-size: 16px;
            line-height: 22px;
        }

        .input.multiline {
            min-height: 72px;
        }

        .counter {
            font-size: 12px;
            color: var(--outline);
            text-align: right;
            margin-top: 4px;
        }

        /* FooterBar */
        .footer {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            padding: 16px;
            border-top: 1px solid var(--outline-variant);
            background: rgba(19, 19, 19, 0.8);
        }

        .primary-button {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 16px;
            border-radius: var(--radius-md);
            background: var(--primary-container);
            color: var(--on-primary);
            font-size: 16px;
            font-weight: 500;
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="status-bar"></div>

    <div class="header">
        <div class="header-action">
            <!-- arrow-back -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#f9fff0" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </div>
        <div class="header-title">Edit Observation</div>
        <div class="header-action right">
            <!-- close -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#f9fff0" aria-hidden="true">
                <path d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12 19 6.41z"/>
            </svg>
        </div>
    </div>

    <div class="content">
        <div>
            <div class="field-label">OBSERVATION NAME</div>
            <div class="input">stale records</div>
            <div class="counter">13/30</div>
        </div>

        <div>
            <div class="field-label">DESCRIPTION</div>
            <div class="input multiline">All four records are 40-60 days old — outside the 30-day trend window, so the
                chart reads empty while the last record date is stale, not missing.
            </div>
            <div class="counter">145/150</div>
        </div>
    </div>

    <div class="footer">
        <div class="primary-button">
            <span>Save Observation</span>
            <!-- check -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#205110" aria-hidden="true">
                <path d="M9 16.17 4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z"/>
            </svg>
        </div>
    </div>
</div>
</body>
</html>
