<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Observation menu — Edit beside Delete</title>
    <!--
      Mockup: the Observation screen (seeded `stale records`) with its ⋮ menu
      open, which is the only state the menu's new Edit item is visible in. The
      menu renders in a transparent Modal window, so the screen behind it is
      undimmed. Colors, type, radii and elevation are the tokens in
      src/presentation/theme/. 393px wide - the Pixel 7 the E2E suite runs on.
    -->
    <style>
        :root {
            --background: #131313;
            --surface: #131313;
            --on-surface: #e5e2e1;
            --on-surface-variant: #c2c9b9;
            --surface-container-low: #1c1b1b;
            --surface-container-high: #2a2a2a;
            --surface-container-highest: #353534;
            --outline-variant: #42493d;
            --outline: #8c9385;
            --primary: #f9fff0;
            --on-primary: #0b3900;
            --primary-container: #b6f09c;
            --error: #ffb4ab;

            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #050505;
            font-family: Roboto, "Segoe UI", system-ui, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px 12px;
        }

        .phone {
            position: relative;
            width: 393px;
            height: 760px;
            background: var(--background);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .status-bar {
            height: 28px;
            flex: none;
        }

        /* ScreenHeader */
        .header {
            flex: none;
            height: 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-bottom: 1px solid var(--outline-variant);
            background: var(--surface);
        }

        .header-action {
            width: 48px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-action.right {
            justify-content: flex-end;
            padding-right: 8px;
        }

        .header-title {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            color: var(--primary);
        }

        .content {
            flex: 1;
            padding: 24px;
        }

        .description {
            font-size: 14px;
            line-height: 20px;
            color: var(--on-surface-variant);
            margin-bottom: 24px;
        }

        .section-caption {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--on-surface-variant);
            margin-bottom: 16px;
        }

        /* TimeRangeSelector */
        .range-row {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .range-segment {
            padding: 8px 0;
            flex: 1;
            text-align: center;
            font-size: 13px;
            color: var(--on-surface-variant);
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-lg);
        }

        .range-segment.custom {
            flex: 1.4;
            font-size: 11px;
        }

        .range-segment.selected {
            background: var(--primary-container);
            border-color: var(--primary-container);
            color: var(--on-primary);
        }

        .trend-card {
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-lg);
            padding: 16px;
            margin-bottom: 40px;
        }

        .trend-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .trend-placeholder {
            height: 108px;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 4px;
            opacity: 0.6;
            font-size: 12px;
            font-weight: 500;
            color: var(--on-surface-variant);
        }

        .record-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 8px;
            border-bottom: 1px solid var(--surface-container-highest);
        }

        .record-time {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface);
        }

        /* The overflow menu's own Modal window: transparent, anchored under the
           header at right: 8. */
        .menu {
            position: absolute;
            top: 92px; /* status bar (28) + ScreenHeader (64) */
            right: 8px;
            width: 192px;
            background: var(--surface-container-high);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-lg);
            overflow: hidden;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.3);
        }

        .menu-item {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 12px 16px;
            font-size: 14px;
            font-weight: 500;
        }

        .menu-item.edit {
            color: var(--on-surface);
        }

        .menu-item.delete {
            color: var(--error);
        }
    </style>
</head>
<body>
<div class="phone">
    <div class="status-bar"></div>

    <div class="header">
        <div class="header-action">
            <!-- arrow-back -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#f9fff0" aria-hidden="true">
                <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z"/>
            </svg>
        </div>
        <div class="header-title">stale records</div>
        <div class="header-action right">
            <!-- more-vert -->
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#e5e2e1" aria-hidden="true">
                <path d="M12 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"/>
            </svg>
        </div>
    </div>

    <div class="content">
        <div class="description">All four records are 40-60 days old — outside the 30-day trend window, so the
            chart reads empty while the last record date is stale, not missing.
        </div>

        <div class="section-caption">TRENDS</div>
        <div class="range-row">
            <div class="range-segment">1D</div>
            <div class="range-segment">1W</div>
            <div class="range-segment selected">1M</div>
            <div class="range-segment">1Y</div>
            <div class="range-segment custom">Custom</div>
        </div>
        <div class="trend-card">
            <div class="trend-card-title">value</div>
            <div class="trend-placeholder">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="#c2c9b9" aria-hidden="true">
                    <path d="M3.5 18.49l6-6.01 4 4L22 6.92l-1.41-1.41-7.09 7.97-4-4L2 16.99z"/>
                </svg>
                <span>Not enough data yet</span>
            </div>
        </div>

        <div class="section-caption">RECENT RECORDS</div>
        <div class="record-row">
            <div class="record-time">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="#c2c9b9" aria-hidden="true">
                    <path d="M12 2a10 10 0 100 20 10 10 0 000-20zm0 18a8 8 0 110-16 8 8 0 010 16zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/>
                </svg>
                <span>41 days ago</span>
            </div>
            <svg width="24" height="24" viewBox="0 0 24 24" fill="#c2c9b9" aria-hidden="true">
                <path d="M10 6L8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
            </svg>
        </div>
    </div>

    <div class="menu">
        <div class="menu-item edit">
            <!-- edit -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#e5e2e1" aria-hidden="true">
                <path d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zM20.71 7.04a1 1 0 000-1.41l-2.34-2.34a1 1 0 00-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
            </svg>
            <span>Edit</span>
        </div>
        <div class="menu-item delete">
            <!-- delete -->
            <svg width="20" height="20" viewBox="0 0 24 24" fill="#ffb4ab" aria-hidden="true">
                <path d="M6 19a2 2 0 002 2h8a2 2 0 002-2V7H6v12zM19 4h-3.5l-1-1h-5l-1 1H5v2h14V4z"/>
            </svg>
            <span>Delete</span>
        </div>
    </div>
</div>
</body>
</html>
