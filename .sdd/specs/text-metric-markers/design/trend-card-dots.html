<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title>Text markers — dots on a centred rule</title>
    <style>
        /* Tokens copied from src/presentation/theme/ so the mockup and the build
           cannot disagree: colors.ts, radius.ts, typography.ts. Lane greens are
           laneColors.ts's own ramps, which stay out of COLORS. */
        :root {
            --background: #131313;
            --surface: #131313;
            --on-surface: #e5e2e1;
            --on-surface-variant: #c2c9b9;
            --surface-container-low: #1c1b1b;
            --outline-variant: #42493d;
            --primary: #f9fff0;
            --on-primary: #0b3900;
            --primary-container: #b6f09c;

            --radius-lg: 12px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background: #000;
            font-family: Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            justify-content: center;
            padding: 24px 0;
        }

        .phone {
            width: 390px;
            height: 844px;
            background: var(--background);
            color: var(--on-surface);
            position: relative;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        /* ScreenHeader.tsx */
        .header {
            height: 64px;
            flex: 0 0 64px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 8px;
            border-bottom: 1px solid var(--outline-variant);
            background: var(--surface);
        }

        .header .icon {
            width: 48px;
            display: flex;
            justify-content: center;
            color: var(--primary);
            font-size: 22px;
        }

        .header .icon.right {
            justify-content: flex-end;
            padding-right: 8px;
            color: var(--on-surface);
        }

        .header .title {
            flex: 1;
            text-align: center;
            font-size: 24px;
            font-weight: 500;
            color: var(--primary);
        }

        .scroll {
            flex: 1;
            padding: 24px;
            overflow: hidden;
        }

        /* TYPOGRAPHY.sectionCaption */
        .section-title {
            font-size: 13px;
            font-weight: 600;
            letter-spacing: 1px;
            color: var(--on-surface-variant);
            margin-bottom: 16px;
        }

        /* TimeRangeSelector.tsx */
        .range-selector {
            display: flex;
            gap: 8px;
            margin-bottom: 16px;
        }

        .segment {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 8px 0;
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-lg);
            font-size: 13px;
            font-weight: 600;
            color: var(--on-surface-variant);
        }

        .segment.selected {
            background: var(--primary-container);
            border-color: var(--primary-container);
            color: var(--on-primary);
        }

        .segment.custom {
            flex: 2;
        }

        /* ObservationDetailsScreen.styles — trendsList gap 12, trendCard, trendCardTitle. */
        .trends-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .trend-card {
            background: var(--surface-container-low);
            border: 1px solid var(--outline-variant);
            border-radius: var(--radius-lg);
            padding: 16px;
        }

        .trend-card-title {
            font-size: 14px;
            font-weight: 600;
            color: var(--primary);
            margin-bottom: 12px;
        }

        .trend-chart {
            height: 108px;
        }

        /* NEW — the Text card is registered shorter than the other three, so it
           takes only the room its marks and its time axis need. */
        .trend-chart.marker {
            height: 40px;
        }
    </style>
</head>
<body>
<!-- The TRENDS section of `mixed metrics` at 1M, scrolled to its last three
     cards: the Boolean swimlane `flag`, the Enum swimlane `category`, and the
     Text card this slice adds. The selector is kept in frame to say which window
     is drawn; on the device it sits above the five Numeric cards that precede
     these three.

     Chart geometry is chartAxis.tsx's: a 308x108 canvas, plot from x=32
     (LABEL_GUTTER) to x=304 (less PLOT_RIGHT_INSET), y=6 (PLOT_TOP_PADDING) to
     y=94 (less TIME_AXIS_HEIGHT), labels at 9px. The Text card is registered
     at 40 rather than 108, so its plot runs y=6 to y=26 and its time labels sit
     under that; every card's plot still spans the same x, which is the
     alignment a column is read across.

     `note` shares its Records with `flag` and `category`, so all three cards
     mark the same ten moments — every other day across the newer two-thirds of
     the window. -->
<div class="phone">
    <div class="header">
        <div class="icon">←</div>
        <div class="title">mixed metrics</div>
        <div class="icon right">⋮</div>
    </div>

    <div class="scroll">
        <div class="section-title">TRENDS</div>
        <div class="range-selector">
            <div class="segment">1D</div>
            <div class="segment">1W</div>
            <div class="segment selected">1M</div>
            <div class="segment">1Y</div>
            <div class="segment custom">Custom</div>
        </div>

        <div class="trends-list">
            <!-- Unchanged by this slice: a two-lane Boolean swimlane. -->
            <div class="trend-card">
                <div class="trend-card-title">flag</div>
                <div class="trend-chart">
                    <svg width="100%" height="108" viewBox="0 0 308 108">
                        <g stroke="#42493d" stroke-opacity="0.6" stroke-width="1">
                            <line x1="32" y1="6" x2="304" y2="6"/>
                            <line x1="32" y1="50" x2="304" y2="50"/>
                            <line x1="32" y1="94" x2="304" y2="94"/>
                        </g>
                        <g fill="#5a8a45">
                            <rect x="138.9" y="9" width="7.1" height="38" rx="3.5"/>
                            <rect x="175.2" y="9" width="7.1" height="38" rx="3.5"/>
                            <rect x="229.6" y="9" width="7.1" height="38" rx="3.5"/>
                            <rect x="265.8" y="9" width="7.1" height="38" rx="3.5"/>
                            <rect x="302.1" y="9" width="1.9" height="38" rx="1"/>
                        </g>
                        <g fill="#b6f09c">
                            <rect x="157.0" y="53" width="7.1" height="38" rx="3.5"/>
                            <rect x="193.3" y="53" width="7.1" height="38" rx="3.5"/>
                            <rect x="211.4" y="53" width="7.1" height="38" rx="3.5"/>
                            <rect x="247.7" y="53" width="7.1" height="38" rx="3.5"/>
                            <rect x="284.0" y="53" width="7.1" height="38" rx="3.5"/>
                        </g>
                        <g fill="#c2c9b9" font-size="9">
                            <text x="0" y="31">Yes</text>
                            <text x="0" y="75">No</text>
                            <text x="32" y="106">Jul 19</text>
                            <text x="87" y="106">Jul 26</text>
                            <text x="155" y="106">Aug 3</text>
                            <text x="223" y="106">Aug 10</text>
                            <text x="278" y="106">Aug 18</text>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- Unchanged by this slice: a three-lane Enum swimlane. -->
            <div class="trend-card">
                <div class="trend-card-title">category</div>
                <div class="trend-chart">
                    <svg width="100%" height="108" viewBox="0 0 308 108">
                        <g stroke="#42493d" stroke-opacity="0.6" stroke-width="1">
                            <line x1="32" y1="6" x2="304" y2="6"/>
                            <line x1="32" y1="35.3" x2="304" y2="35.3"/>
                            <line x1="32" y1="64.7" x2="304" y2="64.7"/>
                            <line x1="32" y1="94" x2="304" y2="94"/>
                        </g>
                        <g fill="#5a8a45">
                            <rect x="138.9" y="9" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="211.4" y="9" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="284.0" y="9" width="7.1" height="23.3" rx="3.5"/>
                        </g>
                        <g fill="#86bd68">
                            <rect x="157.0" y="38.3" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="193.3" y="38.3" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="247.7" y="38.3" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="302.1" y="38.3" width="1.9" height="23.3" rx="1"/>
                        </g>
                        <g fill="#b6f09c">
                            <rect x="175.2" y="67.7" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="229.6" y="67.7" width="7.1" height="23.3" rx="3.5"/>
                            <rect x="265.8" y="67.7" width="7.1" height="23.3" rx="3.5"/>
                        </g>
                        <g fill="#c2c9b9" font-size="9">
                            <text x="0" y="24">a</text>
                            <text x="0" y="53">b</text>
                            <text x="0" y="82">c</text>
                            <text x="32" y="106">Jul 19</text>
                            <text x="87" y="106">Jul 26</text>
                            <text x="155" y="106">Aug 3</text>
                            <text x="223" y="106">Aug 10</text>
                            <text x="278" y="106">Aug 18</text>
                        </g>
                    </svg>
                </div>
            </div>

            <!-- NEW — the Text card this slice adds. Candidate 1 of 3: dots on a centred rule. -->
            <div class="trend-card">
                <div class="trend-card-title">note</div>
                <div class="trend-chart marker">
                    <svg width="100%" height="40" viewBox="0 0 308 40">
                        <!-- A faint rule across the middle of the plot, with a
                             haloed dot on it per bucket holding text. The halo
                             is the card's own background, as the Numeric card's
                             is, so a dot reads as a node rather than a bulge. -->
                        <line x1="32" y1="16" x2="304" y2="16"
                              stroke="#42493d" stroke-opacity="0.6" stroke-width="1"/>
                        <g>
                            <circle cx="138.9" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="157.0" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="175.2" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="193.3" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="211.4" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="229.6" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="247.7" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="265.8" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="284.0" cy="16" r="4" fill="#1c1b1b"/>
                            <circle cx="302.1" cy="16" r="4" fill="#1c1b1b"/>
                        </g>
                        <g fill="#b6f09c">
                            <circle cx="138.9" cy="16" r="2.5"/>
                            <circle cx="157.0" cy="16" r="2.5"/>
                            <circle cx="175.2" cy="16" r="2.5"/>
                            <circle cx="193.3" cy="16" r="2.5"/>
                            <circle cx="211.4" cy="16" r="2.5"/>
                            <circle cx="229.6" cy="16" r="2.5"/>
                            <circle cx="247.7" cy="16" r="2.5"/>
                            <circle cx="265.8" cy="16" r="2.5"/>
                            <circle cx="284.0" cy="16" r="2.5"/>
                            <circle cx="302.1" cy="16" r="2.5"/>
                        </g>
                        <!-- No bucket here folds two Records, so no count is
                             drawn. Where one does — this card at 1Y — the count
                             sits centred above the halo, at the Numeric card's
                             own muted colour. Its offset is 7px rather than the
                             Numeric card's 9 — that one clears a halo sitting on
                             a curve, and there is no curve here — which is what
                             lets the band between the paddings be 20px. -->
                        <!-- The left gutter is reserved as every card reserves
                             it, so the three plots start on one edge — and left
                             unlabelled, there being no value axis and no lanes
                             to name. -->
                        <g fill="#c2c9b9" font-size="9">
                            <text x="32" y="38">Jul 19</text>
                            <text x="87" y="38">Jul 26</text>
                            <text x="155" y="38">Aug 3</text>
                            <text x="223" y="38">Aug 10</text>
                            <text x="278" y="38">Aug 18</text>
                        </g>
                    </svg>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
